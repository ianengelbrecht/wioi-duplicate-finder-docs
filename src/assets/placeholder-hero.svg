<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Definition for grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a" rx="8"/>
  <rect width="800" height="600" fill="url(#grid)" rx="8"/>

  <!-- Simulated App Frame UI -->
  <rect x="40" y="40" width="720" height="520" fill="#1e293b" rx="6" stroke="#475569" stroke-width="2"/>
  
  <!-- App Title Bar -->
  <rect x="40" y="40" width="720" height="40" fill="#0f172a" rx="6"/>
  <!-- Window Controls -->
  <circle cx="65" cy="60" r="6" fill="#ef4444"/>
  <circle cx="85" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="60" r="6" fill="#10b981"/>
  <!-- Window Title -->
  <text x="400" y="65" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="500">VARUNA Duplicate Finder</text>

  <!-- Two-Column Layout -->
  <!-- Left Panel: Duplicate Search -->
  <rect x="60" y="100" width="330" height="440" fill="#0f172a" rx="4" stroke="#334155" stroke-width="1"/>
  <text x="80" y="130" font-family="'Outfit', sans-serif" font-size="16" fill="#f8fafc" font-weight="600">Search &amp; Find Duplicates</text>
  <rect x="80" y="150" width="290" height="30" fill="#1e293b" rx="2" stroke="#475569" stroke-width="1"/>
  <text x="95" y="170" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Search specimens (e.g. Solanum)...</text>
  <!-- Search Results list items -->
  <rect x="80" y="195" width="290" height="60" fill="#1e293b" rx="2" stroke="#0284c7" stroke-width="1.5"/>
  <text x="95" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#38bdf8" font-weight="600">Solanum lycopersicum L.</text>
  <text x="95" y="232" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Coll: Smith, J. #1245 - 2018-05-12</text>
  <text x="95" y="247" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">GBIF Reference • Matches 87%</text>

  <rect x="80" y="265" width="290" height="60" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1"/>
  <text x="95" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">Solanum tuberosum L.</text>
  <text x="95" y="302" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Coll: Miller, A. #482 - 2012-09-01</text>
  
  <!-- Right Panel: Data Capture Form -->
  <rect x="410" y="100" width="330" height="440" fill="#0f172a" rx="4" stroke="#334155" stroke-width="1"/>
  <text x="430" y="130" font-family="'Outfit', sans-serif" font-size="16" fill="#f8fafc" font-weight="600">Specimen Capture Form</text>
  <!-- Field 1: Scientific Name -->
  <text x="430" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Scientific Name</text>
  <rect x="430" y="175" width="290" height="30" fill="#1e293b" rx="2" stroke="#475569" stroke-width="1"/>
  <text x="442" y="194" font-family="'Inter', sans-serif" font-size="13" fill="#f8fafc">Solanum lycopersicum L.</text>
  <!-- Field 2: Collector -->
  <text x="430" y="225" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Collector</text>
  <rect x="430" y="235" width="135" height="30" fill="#1e293b" rx="2" stroke="#475569" stroke-width="1"/>
  <text x="442" y="254" font-family="'Inter', sans-serif" font-size="13" fill="#f8fafc">Smith, J.</text>
  <!-- Field 3: Number -->
  <text x="585" y="225" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Number</text>
  <rect x="585" y="235" width="135" height="30" fill="#1e293b" rx="2" stroke="#475569" stroke-width="1"/>
  <text x="597" y="254" font-family="'Inter', sans-serif" font-size="13" fill="#f8fafc">1245</text>
  <!-- Field 4: Locality -->
  <text x="430" y="285" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Locality</text>
  <rect x="430" y="295" width="290" height="50" fill="#1e293b" rx="2" stroke="#475569" stroke-width="1"/>
  <text x="442" y="315" font-family="'Inter', sans-serif" font-size="13" fill="#f8fafc">WIOI Region, Madagascar</text>
  <!-- Save Button -->
  <rect x="430" y="480" width="290" height="40" fill="#0284c7" rx="4"/>
  <text x="575" y="505" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Save Record</text>

  <!-- Overlay Placeholder info text -->
  <rect x="200" y="240" width="400" height="120" fill="#1e293b" fill-opacity="0.95" rx="8" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="280" font-family="'Outfit', sans-serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="bold">Hero Image Placeholder</text>
  <text x="400" y="310" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Replace with a screenshot of the actual application</text>
  <text x="400" y="335" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">src/assets/placeholder-hero.svg</text>
</svg>
